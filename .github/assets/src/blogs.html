<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Hanken+Grotesk:wght@500;600&display=block" rel="stylesheet">
<style>html,body{margin:0;padding:0;overflow:hidden}svg{display:block}</style>
<svg id="s"></svg>
<script src="kit.js"></script><script src="common.js"></script>
<script>
// One plugin, many blogs: a new version reaches every blog; a template a blog overrode stays its own. 10 s loop.
(async()=>{await ready(1600,620);
const t=TIME%10,MONO='ui-monospace,Menlo,monospace';
const ease=k=>{k=Math.max(0,Math.min(1,k));return k*k*(3-2*k)};
const NEW=t>=2.3,ARRIVE=4.2;
txt(80,96,'One plugin, many blogs',{f:S.tf,fs:64,a:'start',ls:-1.5,w:400});
// the line under the title tells the story one step at a time
const CAP=[[0,'Installed once. Each blog keeps its own blog-ops/ folder.'],[2.0,'A new version arrives once.'],[3.0,'Every blog uses it straight away.'],[5.6,'A template a blog overrode stays its own.']];
let ci=0;CAP.forEach((c,i)=>{if(t>=c[0])ci=i});
txt(83,140,CAP[ci][1],{f:S.tf,fs:28,a:'start',i:true,fill:S.muted,w:400,op:ease((t-CAP[ci][0])/0.25)});

// the plugin box with five shelves
const px=80,py=190,pw=430,ph=380;
el('rect',{x:px,y:py,width:pw,height:ph,rx:14,fill:S.card,stroke:S.rule,'stroke-width':2.5});
txt(px+28,py+48,'Pilcrino plugin',{f:S.tf,fs:32,a:'start',w:400});
// version pill: flips when the new version lands
const vx=px+pw-120,vy=py+22,pulse=t>=2.3&&t<3.0?1-ease((t-2.3)/0.7):0;
el('rect',{x:vx,y:vy,width:96,height:36,rx:18,fill:NEW?'#e3efd9':'#efe6d2',stroke:NEW?S.ok:S.rule,'stroke-width':2+pulse*3});
txt(vx+48,vy+25,NEW?'v0.57':'v0.56',{fs:20,f:MONO,w:400,fill:NEW?S.ok:S.muted});
// the new version drops in from above
if(t>=1.6&&t<2.3){const k=ease((t-1.6)/0.7);
 const q=g({transform:`translate(${vx+48} ${vy-120+k*138}) rotate(${(1-k)*-10})`,opacity:1-Math.max(0,(k-.85)/.15)});
 el('rect',{x:-48,y:-18,width:96,height:36,rx:18,fill:'#e3efd9',stroke:S.ok,'stroke-width':2},q);
 txt(0,7,'v0.57',{fs:20,f:MONO,w:400,fill:S.ok,p:q})}
const SH=[['skills','12'],['agents','7'],['adapters','6'],['templates','19'],['standards','2']];
SH.forEach(([n,c],i)=>{const y=py+84+i*56;
 el('line',{x1:px+24,y1:y+46,x2:px+pw-24,y2:y+46,stroke:S.rule,'stroke-width':2});
 txt(px+30,y+32,n+'/',{fs:22,f:MONO,a:'start',w:400});
 // a row of little files on the shelf
 const k=Math.min(+c,12);for(let j=0;j<k;j++)el('rect',{x:px+190+j*18,y:y+14,width:12,height:28,rx:2,fill:'#fff',stroke:S.rule,'stroke-width':1.5});
});

// three blogs, each with its own blog-ops/
const BL=[{n:'your-saas.com',c:S.c.peri,y:190},{n:'side-project.dev',c:S.c.lilac,y:320,over:true},{n:'client-blog.com',c:S.c.peach,y:450}];
const bx=720,bw=800,bh=120;
BL.forEach((b,i)=>{
 // the wire from the plugin to this blog, and a pulse along it after an update
 const x0=px+pw,y0=py+ph/2,x1=bx,y1=b.y+bh/2,d=`M${x0} ${y0} C${x0+150} ${y0} ${x1-150} ${y1} ${x1} ${y1}`;
 const w=el('path',{d,fill:'none',stroke:S.rule,'stroke-width':3,'stroke-dasharray':'2 10','stroke-linecap':'round'});
 if(t>=3.0&&t<ARRIVE+.1){const L=w.getTotalLength(),p=w.getPointAtLength(L*ease((t-3.0)/(ARRIVE-3.0)));
  el('circle',{cx:p.x,cy:p.y,r:9,fill:S.ok})}
 const got=t>=ARRIVE,flash=got&&t<ARRIVE+1?1-ease((t-ARRIVE)/1):0;
 el('rect',{x:bx,y:b.y,width:bw,height:bh,rx:14,fill:S.card,stroke:S.rule,'stroke-width':2.5});
 // folder tab in the blog's tint
 el('rect',{x:bx+20,y:b.y+18,width:30,height:22,rx:4,fill:b.c});
 txt(bx+62,b.y+37,b.n,{fs:22,a:'start',w:600});
 // uses the plugin: this chip updates with it
 const cx=bx+bw-200,cy=b.y+16;
 el('rect',{x:cx,y:cy,width:180,height:30,rx:15,fill:got?'#e3efd9':'#efe6d2',stroke:got?S.ok:S.rule,'stroke-width':1.5+flash*3});
 txt(cx+90,cy+21,'plugin '+(got?'v0.57':'v0.56'),{fs:17,f:MONO,w:400,fill:got?S.ok:S.muted});
 // its own files: no plugin default, unique per blog
 const files=['voice.md','audience.md','image-style.md'];
 let fx=bx+20;files.forEach(f=>{const wdt=f.length*10.4+24;
  el('rect',{x:fx,y:b.y+64,width:wdt,height:34,rx:6,fill:b.c,opacity:.45});
  txt(fx+wdt/2,b.y+87,f,{fs:16,f:MONO,w:400});fx+=wdt+10});
 if(b.over){const f='templates/outline.md',wdt=f.length*10.4+24,hi=t>=5.6?Math.sin(Math.min(1,(t-5.6)/0.8)*Math.PI):0;
  el('rect',{x:fx,y:b.y+64,width:wdt,height:34,rx:6,fill:b.c,stroke:shade(b.c,.7),'stroke-width':2+hi*3});
  txt(fx+wdt/2,b.y+87,f,{fs:16,f:MONO,w:400});
 }
});
document.title='ready';})();
</script>
